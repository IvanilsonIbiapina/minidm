<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body {
    width: 380px;
    margin: 0;
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    background: #0a7bd8; color: #fff;
  }
  header .title { font-weight: 600; flex: 1; }
  #apiDot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #999; display: inline-block;
  }
  #apiDot.up { background: #35c759; }
  #apiDot.down { background: #ff5f57; }
  #status { font-size: 11px; opacity: .9; }
  main { max-height: 420px; overflow-y: auto; }
  .item { border-bottom: 1px solid rgba(128,128,128,.25); padding: 8px 12px; }
  .item .url {
    font-size: 12px; word-break: break-all; color: #0a7bd8;
    cursor: pointer; text-decoration: underline;
  }
  .item .meta { font-size: 11px; opacity: .75; margin-top: 2px; }
  .item .actions { margin-top: 6px; display: flex; gap: 6px; align-items: center; }
  button {
    font: inherit; padding: 4px 10px; border: 0; border-radius: 4px;
    background: #0a7bd8; color: #fff; cursor: pointer;
  }
  button:hover { background: #0866b5; }
  button.secondary { background: rgba(128,128,128,.25); color: inherit; }
  button:disabled { opacity: .5; cursor: default; }
  select { font: inherit; max-width: 190px; }
  .empty { padding: 24px 16px; text-align: center; opacity: .7; }
  .qualities { margin-top: 6px; }
  .qualities .q {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 0; font-size: 12px;
  }
  .qualities .q .label { flex: 1; }
  .qualities .q .size { opacity: .7; font-size: 11px; }
  footer { padding: 8px 12px; font-size: 11px; opacity: .7; text-align: center; }
</style>
</head>
<body>
<header>
  <span class="title">minidm — vídeos detectados</span>
  <span id="status">verificando…</span>
  <span id="apiDot"></span>
</header>
<main id="list"><div class="empty">Carregando…</div></main>
<footer>API: <code>127.0.0.1:9742</code> — inicie com <code>python -m minidm serve</code> ou a GUI</footer>
<script src="popup.js"></script>
</body>
</html>
