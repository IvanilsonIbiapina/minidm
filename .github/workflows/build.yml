name: build

# Build dos executáveis do minidm em Windows, Linux e macOS.
# Não faz cross-compile: cada runner nativo compila o próprio alvo.
#
# Releases: ao pushar uma TAG `v*`, o job `release` junta os pacotes
# (Windows/Linux/macOS) + o APK Android e publica uma GitHub Release.
#   git tag v1.1.0 && git push origin v1.1.0
# O APK (android/, Chaquopy + WebView) é buildado pelo job `apk`.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements.txt

      - name: suíte de testes
        shell: bash
        run: |
          export PYTHONIOENCODING=utf-8
          # -e/-o pipefail já vêm do shell padrão do Actions: captura o
          # código do unittest sem abortar antes de publicar as falhas
          status=0
          python -m unittest discover -s tests 2>&1 | tee suite.log || status=$?
          if [ "$status" -ne 0 ]; then
            # anota as falhas como ANOTAÇÕES do check-run — visíveis na
            # API pública (/check-runs/{id}/annotations) sem login
            # (primeiro o resumo; depois as falhas, com grep em arquivo
            # p/ não tomar SIGPIPE do head e abortar com pipefail)
            resumo=$(tail -n 30 suite.log)
            resumo=${resumo//%/%25}
            resumo=${resumo//$'\r'/%0D}
            resumo=${resumo//$'\n'/%0A}
            echo "::error title=últimas linhas da suíte::${resumo}"
            grep -E '^(FAIL|ERROR): ' suite.log > falhas.txt || true
            head -n 30 falhas.txt > falhas10 || true
            while IFS= read -r linha; do
              linha=${linha//%/%25}
              echo "::error title=falha no teste::${linha}"
            done < falhas10
            exit "$status"
          fi

  build:
    name: executáveis (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cli: dist/minidm/minidm.exe
            pkg: minidm-win64.zip
          - os: ubuntu-latest
            cli: dist/minidm/minidm
            pkg: minidm-linux-x86_64.tar.gz
          - os: macos-latest
            cli: dist/minidm/minidm
            pkg: minidm-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          status=0
          cmd //c "build\windows.bat" 2>&1 | tee build.log || status=$?
          if [ "$status" -ne 0 ]; then
            bash .github/ci/annotate-fail.sh "falha no build (Windows)" build.log 40
            exit "$status"
          fi

      - name: build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          status=0
          bash build/unix.sh 2>&1 | tee build.log || status=$?
          if [ "$status" -ne 0 ]; then
            bash .github/ci/annotate-fail.sh "falha no build (${{ runner.os }})" build.log 40
            exit "$status"
          fi

      - name: smoke (CLI abre)
        shell: bash
        run: |
          CLI="${{ matrix.cli }}"
          status=0
          "$CLI" --version 2>&1 | tee smoke.log || status=$?
          "$CLI" config show >>smoke.log 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            bash .github/ci/annotate-fail.sh "smoke do CLI falhou" smoke.log 20
            exit "$status"
          fi

      # onedir = exe + _internal/: o PACOTE leva a pasta inteira
      # (um .exe solto não roda — precisa do _internal ao lado)
      - name: pacota (bundle completo)
        shell: bash
        run: |
          cp packaging/LEIA-ME.txt dist/
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd dist && 7z a "../${{ matrix.pkg }}" minidm minidm-gui LEIA-ME.txt)
          else
            tar -czf "${{ matrix.pkg }}" -C dist minidm minidm-gui LEIA-ME.txt
          fi
          ls -lh "${{ matrix.pkg }}"

      - uses: actions/upload-artifact@v4
        with:
          name: minidm-${{ matrix.os }}
          path: ${{ matrix.pkg }}
          if-no-files-found: error
          retention-days: 14

  apk:
    # APK Android (android/): Chaquopy embute a engine Python + webui num
    # WebView. Sem cross-compile: roda no ubuntu (SDK Android pré-instalado).
    name: apk Android (Chaquopy)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # buildPython do Chaquopy exige Python do MESMO major.minor do APK
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"      # mínimo do AGP 8.7

      - name: build APK (debug)
        shell: bash
        run: |
          status=0
          gradle -p android assembleDebug --stacktrace 2>&1 | tee gradle.log || status=$?
          if [ "$status" -ne 0 ]; then
            # primeiro a CAUSA RAIZ (no Gradle ela fica depois dos frames
            # de stack trace): seções "What went wrong" + linhas "Caused by"
            grep -A 6 "What went wrong" gradle.log > raiz.txt || true
            grep -E "Caused by:|Execution failed for task|error:|FAILURE:" gradle.log >> raiz.txt || true
            bash .github/ci/annotate-fail.sh "causa raiz do APK" raiz.txt 40
            bash .github/ci/annotate-fail.sh "falha no build do APK" gradle.log 40
            exit "$status"
          fi

      - name: pacota (nome estável p/ release)
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk minidm-android.apk
          ls -lh minidm-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: minidm-android
          path: minidm-android.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: publica release
    # só em tag v* (ex.: v1.1.0) — em push normal não roda
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # cria a Release com o GITHUB_TOKEN
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: minidm-*
          path: pacotes
          merge-multiple: true

      - name: lista pacotes
        run: ls -lh pacotes/

      - uses: softprops/action-gh-release@v2
        with:
          files: pacotes/*
          generate_release_notes: true
          body: |
            ### minidm ${{ github.ref_name }}

            | Pacote | Sistema |
            |---|---|
            | `minidm-win64.zip` | Windows x64 |
            | `minidm-linux-x86_64.tar.gz` | Linux x86_64 |
            | `minidm-macos-arm64.tar.gz` | macOS Apple Silicon |
            | `minidm-android.apk` | Android (arm64-v8a + x86_64) |

            Cada zip traz `minidm/` (CLI) + `minidm-gui/` (interface) +
            `LEIA-ME.txt` — extraia e duplo clique em
            `minidm-gui/minidm-gui.exe`. Sem Python instalado na máquina.
            Se o SmartScreen bloquear: "Mais informações" → "Executar assim".
            **yt-dlp vem embutido** (zip e APK — links de página como
            YouTube funcionam sem instalar nada); o ffmpeg continua externo
            (`minidm deps` mostra o que falta; sem ele seguem arquivos
            diretos e os formatos progressivos).
            O `minidm-android.apk` instala direto no celular: engine Python
            embutida (Chaquopy) + webui em WebView — os arquivos baixados
            aparecem em `Download/<categoria>` do sistema (MediaStore;
            Android 7–9 pede a permissão de armazenamento na 1ª abertura).

            Novidades desta versão:

            * **downloads em segundo plano (Android)**: saindo do app, a
              fila continua num serviço em primeiro plano — notificação
              de progresso (toque reabre o app), WifiLock + wake lock
              para a tela desligada não cortar a transferência; o serviço
              **para sozinho quando a fila esvazia**;
            * **bandeja no Windows**: fechar a janela some para a bandeja
              do sistema (os downloads seguem); duplo clique no ícone
              reabre e o menu **Sair** encerra de verdade
              (`close_to_tray`, ligado por padrão);
            * **nomes de arquivo**: o nome vem do `Content-Disposition`,
              do nome com extensão no link ou do **título da página**
              (não mais o id cru do YouTube, ex.: `5dWeeUIZFgA`);
            * **nada de download vazio**: servidor sem tamanho (o YouTube
              responde `Content-Length: 0` no HEAD) vira erro claro e
              arquivos de 0 bytes não são publicados no MediaStore;
            * **yt-dlp embutido (zip e APK)**: colar um link de página
              (YouTube, Instagram…) **baixa direto**, sem Termux e sem
              `pip install` — a extração roda in-process dentro do app
              (licença Unlicense/GPLv2 do yt-dlp respeitada: só
              invocamos a CLI e lemos o JSON);
            * a webui mostra o **destino publicado** (`Download/…`) no
              card de cada tarefa concluída no Android.
