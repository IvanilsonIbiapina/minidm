name: build

# Build dos executáveis do minidm em Windows, Linux e macOS.
# Não faz cross-compile: cada runner nativo compila o próprio alvo.
#
# Releases: ao pushar uma TAG `v*`, o job `release` junta os pacotes
# (Windows/Linux/macOS) + o APK Android e publica uma GitHub Release.
#   git tag v1.1.0 && git push origin v1.1.0
# O APK (android/, Chaquopy + WebView) é buildado pelo job `apk`.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements.txt

      - name: suíte de testes
        shell: bash
        run: |
          export PYTHONIOENCODING=utf-8
          python -m unittest discover -s tests

  build:
    name: executáveis (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cli: dist/minidm/minidm.exe
            pkg: minidm-win64.zip
          - os: ubuntu-latest
            cli: dist/minidm/minidm
            pkg: minidm-linux-x86_64.tar.gz
          - os: macos-latest
            cli: dist/minidm/minidm
            pkg: minidm-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build\windows.bat

      - name: build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash build/unix.sh

      - name: smoke (CLI abre)
        shell: bash
        run: |
          CLI="${{ matrix.cli }}"
          "$CLI" --version
          "$CLI" config show >/dev/null

      # onedir = exe + _internal/: o PACOTE leva a pasta inteira
      # (um .exe solto não roda — precisa do _internal ao lado)
      - name: pacota (bundle completo)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${{ matrix.pkg }}" ./dist/minidm ./dist/minidm-gui
          else
            tar -czf "${{ matrix.pkg }}" -C dist minidm minidm-gui
          fi
          ls -lh "${{ matrix.pkg }}"

      - uses: actions/upload-artifact@v4
        with:
          name: minidm-${{ matrix.os }}
          path: ${{ matrix.pkg }}
          if-no-files-found: error
          retention-days: 14

  apk:
    # APK Android (android/): Chaquopy embute a engine Python + webui num
    # WebView. Sem cross-compile: roda no ubuntu (SDK Android pré-instalado).
    name: apk Android (Chaquopy)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # buildPython do Chaquopy exige Python do MESMO major.minor do APK
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"      # mínimo do AGP 8.7

      - name: build APK (debug)
        run: gradle -p android assembleDebug --stacktrace

      - name: pacota (nome estável p/ release)
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk minidm-android.apk
          ls -lh minidm-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: minidm-android
          path: minidm-android.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: publica release
    # só em tag v* (ex.: v1.1.0) — em push normal não roda
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # cria a Release com o GITHUB_TOKEN
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: minidm-*
          path: pacotes
          merge-multiple: true

      - name: lista pacotes
        run: ls -lh pacotes/

      - uses: softprops/action-gh-release@v2
        with:
          files: pacotes/*
          generate_release_notes: true
          body: |
            ### minidm ${{ github.ref_name }}

            | Pacote | Sistema |
            |---|---|
            | `minidm-win64.zip` | Windows x64 |
            | `minidm-linux-x86_64.tar.gz` | Linux x86_64 |
            | `minidm-macos-arm64.tar.gz` | macOS Apple Silicon |
            | `minidm-android.apk` | Android (arm64-v8a + x86_64) |

            Cada zip traz `minidm/` (CLI) + `minidm-gui/` (interface) —
            extraia e rode. Sem Python instalado na máquina.
            yt-dlp e ffmpeg continuam externos (`minidm deps` mostra o que falta).
            O `minidm-android.apk` instala direto no celular: engine Python
            embutida (Chaquopy) + webui em WebView.
