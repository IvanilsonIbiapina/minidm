<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>miniDM</title>
<link rel="stylesheet" href="/webui/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo">&#8595;</span>
    <span>miniDM</span>
    <span id="conn" class="conn" title="conexão com a API local">&#9679;</span>
  </div>
  <button id="theme-btn" class="icon-btn" type="button" aria-label="Alternar tema">&#9684;</button>
</header>

<section class="add">
  <form id="add-form" autocomplete="off">
    <div class="row">
      <input id="url" name="url" type="url" inputmode="url" required
             placeholder="Cole o link do arquivo, vídeo ou magnet…" spellcheck="false">
      <button type="submit" class="primary">Baixar</button>
    </div>
    <div class="row sub">
      <select id="category" aria-label="Categoria">
        <option value="">Automático</option>
      </select>
      <label class="chk" title="Analisa a página no servidor e escolhe a melhor qualidade (HLS/DASH)">
        <input type="checkbox" id="analyze" checked>
        <span>Analisar mídia</span>
      </label>
    </div>
    <div class="row">
      <input id="dest" name="dest" type="text" spellcheck="false"
             autocomplete="off" aria-label="Pasta de destino"
             placeholder="Pasta padrão da categoria">
    </div>
  </form>
</section>

<div class="toolbar">
  <span id="counts" class="counts">&nbsp;</span>
  <span class="acts">
    <button id="start-all" class="ghost" type="button" title="Iniciar toda a fila">&#9654; Tudo</button>
  </span>
</div>

<!-- busca + filtro por estado (histórico: as concluídas continuam na fila) -->
<div class="filters">
  <input id="q" type="search" placeholder="Buscar na fila…"
         aria-label="Buscar por nome ou URL" spellcheck="false"
         autocomplete="off">
  <div class="tabs" role="tablist" aria-label="Filtrar por estado">
    <button class="tab on" data-filter="all" type="button" role="tab"
            aria-selected="true">Todos</button>
    <button class="tab" data-filter="active" type="button" role="tab"
            aria-selected="false">Ativos</button>
    <button class="tab" data-filter="done" type="button" role="tab"
            aria-selected="false">Concluídos</button>
    <button class="tab" data-filter="error" type="button" role="tab"
            aria-selected="false">Erros</button>
  </div>
</div>

<main id="list" class="list" aria-live="polite"></main>

<div id="empty" class="empty">Nada na fila ainda — cole um link acima.</div>

<!-- escolher qualidade antes de baixar (estilo IDM: a caixa de
     formatos aparece depois da análise da página) -->
<div id="pick" class="sheet-back" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pick-title">
    <div class="sheet-head">
      <span id="pick-title">Escolher qualidade</span>
      <button type="button" class="icon-btn" id="pick-close"
              aria-label="Cancelar">&#10005;</button>
    </div>
    <div id="pick-list" class="pick-list"></div>
  </div>
</div>

<!-- menu de contexto das tarefas (botão direito / botão ⋯ — estilo IDM) -->
<div id="ctx" class="ctx" role="menu" hidden>
  <button type="button" data-ctx="open-folder" role="menuitem">Abrir pasta</button>
  <button type="button" data-ctx="open-file" role="menuitem" hidden>Abrir arquivo</button>
  <button type="button" data-ctx="copy" role="menuitem">Copiar URL</button>
  <button type="button" data-ctx="props" role="menuitem">Propriedades</button>
  <button type="button" data-ctx="up" role="menuitem">&#8593; Subir</button>
  <button type="button" data-ctx="down" role="menuitem">&#8595; Descer</button>
  <button type="button" data-ctx="remove" role="menuitem" class="danger">Remover</button>
</div>

<!-- propriedades da tarefa (GET /task — campos completos do registro) -->
<div id="props" class="sheet-back" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="props-title">
    <div class="sheet-head">
      <span id="props-title">Propriedades</span>
      <button type="button" class="icon-btn" id="props-close"
              aria-label="Fechar">&#10005;</button>
    </div>
    <dl id="props-list" class="props-list"></dl>
  </div>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<script src="/webui/app.js"></script>
</body>
</html>
