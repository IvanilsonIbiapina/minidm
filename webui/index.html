<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>miniDM</title>
<link rel="stylesheet" href="/webui/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo">&#8595;</span>
    <span>miniDM</span>
    <span id="conn" class="conn" title="conexão com a API local">&#9679;</span>
  </div>
  <span class="top-acts">
    <button id="cfg-btn" class="icon-btn" type="button"
            aria-label="Configurações" title="Configurações">&#9881;</button>
    <button id="theme-btn" class="icon-btn" type="button" aria-label="Alternar tema">&#9684;</button>
  </span>
</header>

<section class="add">
  <form id="add-form" autocomplete="off">
    <div class="row">
      <input id="url" name="url" type="url" inputmode="url" required
             placeholder="Cole o link do arquivo, vídeo ou magnet…" spellcheck="false">
      <button type="submit" class="primary">Baixar</button>
    </div>
    <div class="row sub">
      <select id="category" aria-label="Categoria">
        <option value="">Automático</option>
      </select>
      <label class="chk" title="Analisa a página no servidor e escolhe a melhor qualidade (HLS/DASH)">
        <input type="checkbox" id="analyze" checked>
        <span>Analisar mídia</span>
      </label>
    </div>
    <div class="row">
      <input id="dest" name="dest" type="text" spellcheck="false"
             autocomplete="off" aria-label="Pasta de destino"
             placeholder="Pasta padrão da categoria">
      <!-- só aparece no APK (window.MinidmBridge): SAF escolhe a pasta -->
      <button id="dest-pick" class="ghost" type="button" hidden>Escolher…</button>
    </div>
  </form>
</section>

<div class="toolbar">
  <span id="counts" class="counts">&nbsp;</span>
  <span class="acts">
    <button id="start-all" class="ghost" type="button" title="Iniciar toda a fila">&#9654; Tudo</button>
  </span>
</div>

<!-- busca + filtro por estado (histórico: as concluídas continuam na fila) -->
<div class="filters">
  <input id="q" type="search" placeholder="Buscar na fila…"
         aria-label="Buscar por nome ou URL" spellcheck="false"
         autocomplete="off">
  <div class="tabs" role="tablist" aria-label="Filtrar por estado">
    <button class="tab on" data-filter="all" type="button" role="tab"
            aria-selected="true">Todos</button>
    <button class="tab" data-filter="active" type="button" role="tab"
            aria-selected="false">Ativos</button>
    <button class="tab" data-filter="done" type="button" role="tab"
            aria-selected="false">Concluídos</button>
    <button class="tab" data-filter="error" type="button" role="tab"
            aria-selected="false">Erros</button>
  </div>
</div>

<main id="list" class="list" aria-live="polite"></main>

<div id="empty" class="empty">Nada na fila ainda — cole um link acima.</div>

<!-- escolher qualidade antes de baixar (estilo IDM: a caixa de
     formatos aparece depois da análise da página) -->
<div id="pick" class="sheet-back" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pick-title">
    <div class="sheet-head">
      <span id="pick-title">Escolher qualidade</span>
      <button type="button" class="icon-btn" id="pick-close"
              aria-label="Cancelar">&#10005;</button>
    </div>
    <div id="pick-list" class="pick-list"></div>
  </div>
</div>

<!-- menu de contexto das tarefas (botão direito / botão ⋯ — estilo IDM) -->
<div id="ctx" class="ctx" role="menu" hidden>
  <button type="button" data-ctx="open-folder" role="menuitem">Abrir pasta</button>
  <button type="button" data-ctx="open-file" role="menuitem" hidden>Abrir arquivo</button>
  <button type="button" data-ctx="copy" role="menuitem">Copiar URL</button>
  <button type="button" data-ctx="props" role="menuitem">Propriedades</button>
  <button type="button" data-ctx="up" role="menuitem">&#8593; Subir</button>
  <button type="button" data-ctx="down" role="menuitem">&#8595; Descer</button>
  <button type="button" data-ctx="remove" role="menuitem" class="danger">Remover</button>
</div>

<!-- propriedades da tarefa (GET /task — campos completos do registro) -->
<div id="props" class="sheet-back" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="props-title">
    <div class="sheet-head">
      <span id="props-title">Propriedades</span>
      <button type="button" class="icon-btn" id="props-close"
              aria-label="Fechar">&#10005;</button>
    </div>
    <dl id="props-list" class="props-list"></dl>
  </div>
</div>

<!-- configurações (POST /config — persiste e aplica ao vivo) -->
<div id="cfg" class="sheet-back" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cfg-title">
    <div class="sheet-head">
      <span id="cfg-title">Configurações</span>
      <button type="button" class="icon-btn" id="cfg-close"
              aria-label="Fechar">&#10005;</button>
    </div>
    <form id="cfg-form" autocomplete="off">
      <fieldset class="cfg-group">
        <legend>Concorrência e banda</legend>
        <label class="fld"><span>Downloads simultâneos</span>
          <input id="cf-max_concurrent" type="number" inputmode="numeric"
                 min="1" max="64" step="1"></label>
        <label class="fld"><span>Conexões no total</span>
          <input id="cf-max_connections" type="number" inputmode="numeric"
                 min="1" max="512" step="1"></label>
        <label class="fld"><span>Segmentos por arquivo (0 = automático)</span>
          <input id="cf-segments" type="number" inputmode="numeric"
                 min="0" max="128" step="1"></label>
        <label class="fld"><span>Fragmentos simultâneos (HLS/DASH)</span>
          <input id="cf-concurrent_fragments" type="number" inputmode="numeric"
                 min="0" max="64" step="1"></label>
        <label class="fld"><span>Limite de velocidade (KB/s, 0 = sem limite)</span>
          <input id="cf-throttle_bps" type="number" inputmode="numeric"
                 min="0" step="1"></label>
      </fieldset>

      <fieldset class="cfg-group">
        <legend>Resiliência</legend>
        <label class="fld"><span>Tentativas por segmento</span>
          <input id="cf-retries" type="number" inputmode="numeric"
                 min="0" max="100" step="1"></label>
        <label class="fld"><span>Limite de playlist (yt-dlp)</span>
          <input id="cf-playlist_limit" type="number" inputmode="numeric"
                 min="1" max="5000" step="1"></label>
        <label class="fld"><span>Arquivo de URLs já baixadas</span>
          <select id="cf-download_archive">
            <option value="true">ligado (pula repetidas)</option>
            <option value="false">desligado</option>
          </select></label>
        <label class="fld"><span>Verificar assinatura (.exe/.dll)</span>
          <select id="cf-verify_signatures">
            <option value="true">sim</option>
            <option value="false">não</option>
          </select></label>
        <label class="fld"><span>Checksum do servidor (.sha256/.md5)</span>
          <select id="cf-remote_checksums">
            <option value="true">sim</option>
            <option value="false">não</option>
          </select></label>
      </fieldset>

      <fieldset class="cfg-group">
        <legend>Vídeos (yt-dlp)</legend>
        <label class="fld"><span>Baixador in-process</span>
          <select id="cf-use_ytdlp_downloader">
            <option value="true">ligado (mais rápido)</option>
            <option value="false">desligado (CLI externa)</option>
          </select></label>
        <label class="fld"><span>Cookies do navegador</span>
          <select id="cf-cookies_from_browser">
            <option value="">nenhum</option>
            <option value="chrome">Chrome</option>
            <option value="chromium">Chromium</option>
            <option value="edge">Edge</option>
            <option value="firefox">Firefox</option>
            <option value="brave">Brave</option>
            <option value="opera">Opera</option>
            <option value="opera_gx">Opera GX</option>
            <option value="vivaldi">Vivaldi</option>
          </select></label>
        <label class="fld"><span>SponsorBlock</span>
          <select id="cf-sponsorblock">
            <option value="">desligado</option>
            <option value="all">tudo</option>
            <option value="sponsor">só patrocínio</option>
            <option value="sponsor,selfpromo">patrocínio + autopromoção</option>
            <option value="sponsor,selfpromo,interaction,intro,outro,preview,music_offtopic">
              todos os tipos</option>
          </select></label>
      </fieldset>

      <fieldset class="cfg-group">
        <legend>Rede e pastas</legend>
        <label class="fld"><span>Proxy (http://host:porta, vazio = direto)</span>
          <input id="cf-proxy" type="text" spellcheck="false"
                 autocomplete="off" placeholder="http://127.0.0.1:8080"></label>
        <label class="fld"><span>Pasta base das categorias</span>
          <span class="pick-row">
            <input id="cf-download_base" type="text" spellcheck="false"
                   autocomplete="off" placeholder="~/Downloads">
            <button id="cfg-pick" class="ghost" type="button" hidden>Escolher…</button>
          </span></label>
        <label class="fld"><span>Publicar em Download/ (Android)</span>
          <select id="cf-android_public_downloads">
            <option value="true">sim</option>
            <option value="false">não (só pasta interna)</option>
          </select></label>
      </fieldset>

      <div class="sheet-acts">
        <button type="button" class="ghost" id="cfg-cancel">Cancelar</button>
        <button type="submit" class="primary">Salvar</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<script src="/webui/app.js"></script>
</body>
</html>
